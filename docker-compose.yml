services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vue3-app-template:local
    container_name: vue3-app-template
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
