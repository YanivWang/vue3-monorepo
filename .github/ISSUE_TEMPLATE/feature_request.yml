name: ✨ 功能需求
description: 提出新功能或改进建议
title: '[Feature]: '
labels: ['enhancement']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请尽量详细描述你的需求和使用场景。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景 / 使用场景
      description: 这个功能要解决什么问题？在什么场景下需要？
      placeholder: 当我 xxx 时，我希望能够 xxx，因为 xxx
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你期望的解决方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？为什么不采用？

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 🔴 高（影响核心流程）
        - 🟡 中（有明显改善）
        - 🟢 低（锦上添花）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 参考链接、相关截图、设计稿等

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issues，未找到相同需求
          required: true
        - label: 此需求不在已有的 PR/里程碑中
          required: true
