name: 🐛 Bug 报告
description: 报告一个可复现的问题
title: '[Bug]: '
labels: ['bug', 'triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写此 Bug 报告！请尽量详细，以帮助我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述 Bug 是什么
      placeholder: 当我点击 xxx 按钮时，页面会 xxx，但预期应该 xxx
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现该问题
      placeholder: |
        1. 进入 '...' 页面
        2. 点击 '...' 按钮
        3. 输入 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 描述你预期应该发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如有截图或录屏，请粘贴在此处
      placeholder: 拖拽图片到此处...

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - 移动端 Chrome
        - 移动端 Safari
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      placeholder: '例如：20.11.0'

  - type: input
    id: project-version
    attributes:
      label: 项目版本
      placeholder: '例如：1.2.3（见 package.json）'

  - type: textarea
    id: console-error
    attributes:
      label: 控制台错误信息
      description: 如有浏览器控制台报错，请粘贴完整信息
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issues，未找到相同问题
          required: true
        - label: 我已在最新代码上复现了此问题
          required: true
