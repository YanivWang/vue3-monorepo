# 将 docs（VitePress）构建产物部署到 GitHub Pages
# 使用说明：仓库 Settings → Pages → Build and deployment → Source 选 GitHub Actions

name: Docs — GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/docs-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 与 GitHub 弃用 Node 20 的 runner 环境对齐，避免 checkout / pnpm action 的 Node 20 告警
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不显式写 version，与根 package.json 的 packageManager 字段一致，避免 ERR_PNPM_BAD_PM_VERSION
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        env:
          # 项目站：/<仓库名>/；若是 username.github.io 根站，改为 VITEPRESS_BASE=/
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
          VITEPRESS_NO_GIT: '1'
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
