name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm and install
        uses: ./.github/actions/pnpm-install

      - name: Workspace vs tsconfig paths
        run: pnpm run check:refs

      - name: Request core (no UI coupling)
        run: pnpm run check:request-core

      # ── 安全扫描：检测 high/critical 级漏洞，发现则 CI 失败 ──
      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Lint (Stylelint)
        run: pnpm run lint:style

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build
