name: Deploy (Staging)

on:
  push:
    branches: [develop]
  # 支持手动触发（选择分支 / 提交）
  workflow_dispatch:
    inputs:
      ref:
        description: '部署的 Git 引用（分支/tag/commit）'
        required: false
        default: develop

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    needs: check
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ── 构建 Staging 专用镜像（使用 development 环境变量）──
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build & Push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Staging 镜像与生产镜像分离，通过 :staging tag 区分
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:staging
            ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:staging-${{ github.sha }}
          # 传入构建参数，staging 使用 development 配置
          build-args: |
            BUILD_MODE=development

      # ── 部署到 Staging 服务器 ──────────────────────────────
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            docker pull ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:staging
            docker stop vue3-app-template-staging 2>/dev/null || true
            docker rm   vue3-app-template-staging 2>/dev/null || true
            docker run -d \
              --name vue3-app-template-staging \
              --restart unless-stopped \
              -p 8080:80 \
              -e APP_ENV=staging \
              ${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:staging
            docker image prune -f

      # ── 部署通知（可选，替换为真实 Slack/钉钉 Webhook）────
      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment ${{ job.status }}: ${{ github.sha }}"
          # curl -X POST "${{ secrets.NOTIFY_WEBHOOK }}" \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text": "Staging 部署${{ job.status == 'success' && '成功' || '失败' }}: ${{ github.sha }}"}'
