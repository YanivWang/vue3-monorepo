# ── 全局限流区（须在 http 块，此处作为 server 级配置示例放在注释中）──────────
# 实际使用时将以下两行移到 nginx.conf 的 http {} 块：
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

# ── HTTP → HTTPS 重定向（生产环境取消注释）───────────────────────────────────
# server {
#     listen 80;
#     server_name example.com www.example.com;
#     return 301 https://$host$request_uri;
# }

# ── HTTPS 主配置（生产环境取消注释，替换证书路径和域名）──────────────────────
# server {
#     listen 443 ssl http2;
#     server_name example.com www.example.com;
#
#     ssl_certificate     /etc/ssl/certs/example.com.pem;
#     ssl_certificate_key /etc/ssl/private/example.com.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     # HSTS（告知浏览器强制 HTTPS，需确保证书有效后再开启）
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # ... 以下 location 配置与 HTTP 版本相同 ...
# }

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Gzip 压缩 ──────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── 安全响应头 ─────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src  'self' 'unsafe-inline'; \
         style-src   'self' 'unsafe-inline'; \
         img-src     'self' data: blob:; \
         font-src    'self' data:; \
         connect-src 'self';"            always;

    # ── 静态资源长效缓存（hash 命名，永不过期）────────────────
    location ^~ /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── SPA fallback ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API 反向代理（可选，前端直连后端时取消注释）──────────────
    # location /api/ {
    #     # 限流：同 IP 每分钟最多 30 次（突发 10 次排队）
    #     limit_req zone=api burst=10 nodelay;
    #     limit_req_status 429;
    #
    #     proxy_pass         http://backend:8080/;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 10s;
    #     proxy_read_timeout    30s;
    # }

    # ── 健康检查端点 ───────────────────────────────────────────
    location /health {
        access_log  off;
        return 200  "ok";
        add_header  Content-Type text/plain;
    }
}
