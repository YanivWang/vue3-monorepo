# vue3-monorepo-template — Admin / H5 / Docs 生产镜像本地验证
#
# 一键启动全部（仓库根目录）：
#   pnpm run docker:up
# 或：
#   docker compose -p vue3-mono -f docker/docker-compose.yaml up --build -d
# 或：
#   ./scripts/docker.sh up
#
# 仅启动某一服务：
#   ./scripts/docker.sh up admin-web
#   ./scripts/docker.sh up h5-web
#   ./scripts/docker.sh up docs-web
#
# 端口（可用环境变量覆盖）：
#   ADMIN_PORT  默认 8080
#   H5_PORT     默认 8081
#   DOCS_PORT   默认 8082

services:
  admin-web:
    build:
      context: ..
      dockerfile: docker/images/admin/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
    image: ${ADMIN_IMAGE:-vue3-mono-admin:local}
    container_name: ${ADMIN_CONTAINER:-vue3-mono-admin}
    ports:
      - '${ADMIN_PORT:-8080}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3

  h5-web:
    build:
      context: ..
      dockerfile: docker/images/h5/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
    image: ${H5_IMAGE:-vue3-mono-h5:local}
    container_name: ${H5_CONTAINER:-vue3-mono-h5}
    ports:
      - '${H5_PORT:-8081}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3

  docs-web:
    build:
      context: ..
      dockerfile: docker/images/docs/Dockerfile
    image: ${DOCS_IMAGE:-vue3-mono-docs:local}
    container_name: ${DOCS_CONTAINER:-vue3-mono-docs}
    ports:
      - '${DOCS_PORT:-8082}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
